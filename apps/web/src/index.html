<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>ASAS Challenge</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#051D49" />
    <meta name="description" content="ASAS Challenge - Elm engagement event" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23051D49'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%230071CE'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!--
      The router uses hash locations (#/host, #/display, #/join/CODE) so the app can be
      served as static files without server rewrite rules. Someone typing a clean path
      such as /host would otherwise be served index.html with an empty hash and land on
      the participant join screen. Translate the path into its hash form before Angular
      bootstraps so both URL shapes work.
    -->
    <script>
      (function () {
        var base = new URL(document.baseURI).pathname;
        var path = location.pathname;
        if (location.hash || path.indexOf(base) !== 0) return;
        var rest = path.slice(base.length).replace(/^\/+/, '');
        if (!rest || rest.indexOf('.') !== -1) return;
        location.replace(base + '#/' + rest + location.search);
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
