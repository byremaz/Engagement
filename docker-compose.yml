services:
  postgres:
    image: postgres:16-alpine
    container_name: asas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asas_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-asas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - asas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asas} -d ${POSTGRES_DB:-asas_challenge}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  asas_pgdata:
