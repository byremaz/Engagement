# Render Blueprint - ASAS Challenge (docs/deploy-render.md)
#
# ONE web service serves both the API and the built Angular bundle from the
# same origin. That is deliberate: every call in the web app is a relative
# `/v1/...` path and the realtime client opens `/v1/socket.io` on the current
# origin, so a single origin means no CORS, no reverse proxy in front of the
# WebSocket, and one region for both. Splitting them would add a proxy hop to
# every 5 Hz race frame, which the red-light tolerance cannot afford.
#
# Region: `frankfurt` is Render's closest region to Riyadh. Network latency is
# charged to the player (plan v2 §7.5) and the red tolerance is 350-450 ms, so
# do not move this to a US region.

databases:
  - name: asas-db
    databaseName: asas_challenge
    user: asas
    plan: free # 30-day expiry; see docs/deploy-render.md before event day
    region: frankfurt

services:
  - type: web
    name: asas-challenge
    runtime: node
    plan: free # free instances sleep after 15 min idle; upgrade for the event
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build:shared && npm run build -w apps/api && npm run build -w apps/web
    # The schema is idempotent, so it is safe to apply on every boot.
    startCommand: node apps/api/dist/apps/api/src/db/migrate.js && node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: asas-db
          property: connectionString
      # Host dashboard credential. Verify it is at least 16 characters.
      - key: HOST_ACCESS_KEY
        generateValue: true
      # Signs participant and display tokens. Must be >= 32 characters and
      # different from HOST_ACCESS_KEY; the API refuses to boot otherwise.
      - key: TOKEN_SECRET
        generateValue: true
      # Same-origin deployment needs no cross-origin allowance. Set this to the
      # service URL only if you later split the web app onto its own host.
      - key: CORS_ORIGINS
        sync: false
